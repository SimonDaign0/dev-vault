$font = Monospace

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
}

input-field {
    monitor =
    size = 15%, 5%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = rgb(143, 143, 143)
    placeholder_text = Password...
    hide_input = false
    position = 0, -50

    dots_size = 0.2
    dots_spacing = 0.2
    fade_on_empty = false
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/hyprlock-battery
    color = rgba(255, 255, 255, 0.8)
    font_size = 15
    font_family = $font

    position = -20, -10
    halign = right
    valign = top
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.8)
    font_size = 18
    font_family = $font

    position = 0, -10
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/hyprlock-ip
    color = rgba(255, 255, 255, 0.8)
    font_size = 15
    font_family = $font

    position = 20, -10
    halign = left
    valign = top
}
