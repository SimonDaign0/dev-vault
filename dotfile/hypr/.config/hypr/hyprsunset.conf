# Default Daytime Profile
profile {
    time = 7:00
    identity = true   # Resets color temperature
}

# Evening Twilight Profile
profile {
    time = 17:30
    temperature = 5000
    gamma = 0.95      # Slight perceived brightness reduction
}

# Deep Night Profile
profile {
    time = 21:00
    temperature = 4000
    gamma = 0.90      # Further dimming for late night
}
